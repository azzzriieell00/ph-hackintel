# Hourly: run the scanner, commit the new data, rebuild the page, publish to GitHub Pages.
name: Scan and deploy

on:
  schedule:
    - cron: "17 * * * *"      # every hour at :17 (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths-ignore: ["data/events.json", "data/review.json", "data/state/**", "index.html"]

permissions:
  contents: write             # commit data/events.json
  pages: write
  id-token: write
  models: read                # free GitHub Models backup for AI reading (uses the workflow's own token)

concurrency:
  group: scan-and-deploy
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30         # the scanner stops opening new pages after 12 minutes (HACKINTEL_SCAN_BUDGET_S)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Scan sources
        env:
          HACKINTEL_CONTACT: ${{ vars.HACKINTEL_CONTACT }}
          HACKINTEL_REPO_URL: https://github.com/${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HACKINTEL_OPENROUTER_MODEL: ${{ vars.HACKINTEL_OPENROUTER_MODEL }}
          HACKINTEL_GROQ_MODEL: ${{ vars.HACKINTEL_GROQ_MODEL }}
          HACKINTEL_CEREBRAS_MODEL: ${{ vars.HACKINTEL_CEREBRAS_MODEL }}
          HACKINTEL_MISTRAL_MODEL: ${{ vars.HACKINTEL_MISTRAL_MODEL }}
          HACKINTEL_GITHUB_MODEL: ${{ vars.HACKINTEL_GITHUB_MODEL }}
          HACKINTEL_LLM_RUN_CAP: ${{ vars.HACKINTEL_LLM_RUN_CAP || '12' }}
          HACKINTEL_GEMINI_MODEL: ${{ vars.HACKINTEL_GEMINI_MODEL }}
          HACKINTEL_LLM_PROVIDER: ${{ vars.HACKINTEL_LLM_PROVIDER }}
          HACKINTEL_LLM_MODEL: ${{ vars.HACKINTEL_LLM_MODEL || 'claude-haiku-5-5' }}
        run: python -m pipeline.run
      - name: Build page
        run: python tools/build_page.py
      - name: Commit data
        run: |
          git config user.name "hackintel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/review.json data/state index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main           # the commit the scan job just pushed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

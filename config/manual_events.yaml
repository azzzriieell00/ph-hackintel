# Events added and checked by a person.
#
# Use this for announcements on platforms the pipeline must not fetch (Facebook, Luma, Devpost)
# or for anything the scanner missed. Open the official page yourself, copy only what it states,
# and set verified_manually to the date and time you checked (Philippine time). A manual check keeps
# an event published for 7 days; after that it needs a new check or a passing automated link check.
#
# Only events with a confirmed place in the Philippines appear on the map. Give at least the city
# and province; add a venue name too if the announcement states one.
# category: hackathon | ctf  (ctf = capture the flag and other cybersecurity competitions)
# Times without an offset are Philippine time. A deadline given as a bare date means 23:59 that day.
# If no registration deadline is stated, put the event start in `deadline` and set deadline_is_estimate: true.
#
# Example (copy, uncomment, fill in from the official page):
#
#  - id: example-ctf-2026
#    name: Example Regional CTF 2026
#    category: ctf
#    organizer: Example Organizer
#    mode: onsite
#    venue: Example Hall
#    city: Iloilo City
#    province: Iloilo
#    start: "2026-12-05T08:00"
#    end: "2026-12-05T18:00"
#    deadline: "2026-11-28"
#    deadline_is_estimate: false
#    eligibility: College students, teams of 3
#    themes: [Web, Forensics, Crypto]
#    registration_url: https://example.org/register
#    official_url: https://example.org/ctf
#    sources:
#      - label: Official announcement
#        url: https://example.org/ctf
#    verified_manually: "2026-11-03T09:00"
#    verified_by: Your name


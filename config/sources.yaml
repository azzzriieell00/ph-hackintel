  # Your own Google Alerts. Create an alert at google.com/alerts, set "Deliver to" = RSS feed,
  # paste the feed URL here and set enabled: true. Alerts links are opened and read.
  - id: alerts-hackathon-ph
    name: Google Alert, hackathon Philippines
    type: rss
    url: https://www.google.com/alerts/feeds/REPLACE_WITH_YOUR_FEED_ID
    enabled: false

  # Template: add any school, organizer or community website. Only its address is needed.
  - id: example-organizer
    name: Example organizer website
    type: site
    url: https://example.edu.ph/
    enabled: false

# Hosts the pipeline never fetches. Links to them are recorded as signals for manual checking.
blocked_hosts:
  - hackathons.ph            # terms: "Do not spam, scrape, or abuse the service or its APIs" (checked 2026-11-02)
  - www.hackathons.ph
  - devpost.com              # terms prohibit automated access, scraping and crawling (checked 2026-11-02)
  - luma.com                 # terms limit access to publicly supported interfaces (checked 2026-11-02)
  - lu.ma
  - facebook.com             # Meta terms prohibit automated collection
  - www.facebook.com
  - m.facebook.com
  - fb.com
  - fb.me
  - instagram.com
  - www.instagram.com
  - x.com
  - twitter.com
  - linkedin.com
  - www.linkedin.com
  - ph.linkedin.com

# Where the pipeline looks for Philippine hackathons and CTF / cybersecurity competitions.
#
# Rules this file follows:
#   * Only public pages and public feeds/APIs, fetched with an honest User-Agent. robots.txt is obeyed,
#     including wildcard rules and Crawl-delay; at least 2 seconds between requests to one host.
#   * No platform whose terms forbid automated access (see blocked_hosts at the bottom).
#     Links that point to those platforms become signals for a person to check, and are never fetched.
#   * Every published event must pass a link check or a recent manual check (pipeline/store.py).
#
# Source types
#   site       : a whole website (school, organizer, news outlet). The scanner finds its RSS/Atom feed
#                by itself and reads it every scan; once a day it also reads homepage links and, on
#                WordPress sites whose robots.txt allows it, the site's own search for "hackathon",
#                "capture the flag" and "hackforgov". Optional: feeds: [url], link_pattern, search: false.
#   event_page : one announcement page, read every scan. Structured event data, else AI reading
#                (cached: an unchanged page is never sent to the AI twice).
#   listing    : a news/events page. Follows links whose text or URL matches link_pattern
#                (or the competition keywords), then reads each like an event_page.
#   rss        : a feed. leads_only: true keeps headlines as signals without opening them.
#   ctftime    : CTFtime's public events API. Only onsite CTFs whose location names the Philippines.
#
# Every source's result (pages read, feeds found, errors, notes) is in data/events.json > sources.
# A source that fails only reports an error; it never stops the scan. To stop using a site, set
# enabled: false. Sites below came up in web searches for Philippine hackathon and CTF news
# (2025-2026 posts, searched on 2026-11-03).

sources:
  # ---------------------------------------------------------------- official event sites (from announcements)
  - id: tcon9-site
    name: TCON9 official site (Hack the North PH)
    type: event_page
    url: https://tcon.hackthenorth.ph
    enabled: true

  - id: techconnect-aideathon-site
    name: Tech Connect SYNC AIdeathon site (BatStateU Alangilan)
    type: event_page
    url: https://techconnect-zeta.vercel.app/
    enabled: true

  # ---------------------------------------------------------------- structured CTF data
  - id: ctftime-ph
    name: CTFtime (onsite CTFs in the Philippines)
    type: ctftime
    url: https://ctftime.org/api/v1/events/
    refresh_hours: 12          # CTFtime asks for 10 s between requests; twice a day is plenty
    enabled: true


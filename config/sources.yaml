  # ---------------------------------------------------------------- off (reasons given)
  # Google News search feeds: robots.txt disallows /rss/search for our bot (checked 2026-11-02).
  - id: gnews-hackathon-ph
    name: Google News, "hackathon" Philippines
    type: rss
    leads_only: true
    url: https://news.google.com/rss/search?q=hackathon+Philippines+when:14d&hl=en-PH&gl=PH&ceid=PH:en
    enabled: false

  # DICT and PIA answered HTTP 403 to the scanner on GitHub Actions (first run, 2026-11-02).
  # The sites refuse automated requests from that network; we do not work around a refusal.
  # Check them by hand and use config/manual_events.yaml, or ask the agency for a feed.
  - id: dict-home
    name: DICT website
    type: listing
    url: https://dict.gov.ph/
    link_pattern: "hack|ctf|capture[- ]the[- ]flag"
    enabled: false

  - id: pia-home
